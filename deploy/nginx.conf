server {
    listen 80;
    server_name _;
    client_max_body_size 200M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API FastAPI + uploads
    # Ojo: /admin y /admin/eventos... son del panel React (SPA).
    # Solo las rutas JSON del API bajo /admin/* se proxyean.
    location ~ ^/(events|comments|upload|media|settings|health|docs|openapi\.json|uploads|ingest) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # GET /admin/me y /admin/settings (JSON) + logout
    location ~ ^/admin/(me|settings|logout)/?$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # POST /admin/login → API; GET /admin/login → SPA (pantalla de login)
    location ~ ^/admin/login/?$ {
        if ($request_method != POST) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA React (incluye /admin, /admin/eventos, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
